<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS NEST 교사 호출</title><style>body{font-family:system-ui,sans-serif;max-width:650px;margin:35px auto;padding:16px;background:#f3f7fb;color:#132d46}main{background:white;border-radius:16px;padding:24px;box-shadow:0 5px 20px #172e4515}label{display:block;margin-top:14px;font-weight:600}input,select,button{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #b8c9d8;border-radius:9px;font-size:16px}button{background:#1465b6;color:white;border:0;cursor:pointer;margin-top:20px}button:disabled{background:#8394a3}#message{white-space:pre-wrap}small{color:#506577}li{margin:9px 0}</style></head><body><main><h1>NEXUS NEST · 교사 호출</h1><small>교실별 호출 상태를 서버에서 확인합니다. 현장 사용 전 네트워크 및 장비를 점검하세요.</small><label for="room">교실</label><select id="room"><option value="HM101">HM101</option><option value="HM102">HM102</option><option value="HM103">HM103</option></select><label for="requester">요청 교사</label><input id="requester" placeholder="교사 이름 (선택)"><label for="reason">호출 사유</label><select id="reason"><option value="지원 요청">지원 요청</option><option value="안전 확인">안전 확인</option><option value="교실 지원">교실 지원</option><option value="기타">기타</option></select><label for="severity">긴급도</label><select id="severity"><option value="WARNING">일반</option><option value="DANGER">긴급</option></select><button id="call">도움 요청 보내기</button><p id="message" role="status"></p><h2>현재 호출</h2><div id="current">불러오는 중...</div><h2>최근 이력</h2><ul id="history"></ul></main><script src="/static/teacher.js"></script></body></html>
